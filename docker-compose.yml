services:
  mysql:
    image: mysql:8.4
    container_name: smartacesso-mysql
    environment:
      MYSQL_DATABASE: controle_acesso
      MYSQL_USER: smartacesso
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartacesso}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - smartacesso-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  smartacesso-mysql:
