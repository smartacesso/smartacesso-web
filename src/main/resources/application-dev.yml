spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:smartacesso;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

smartacesso:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-chars!!}
  bootstrap:
    enabled: true
    unidade: desenvolvimento
    admin-login: admin
    admin-password: "123456"
    admin-nome: Administrador Dev
    app-login: pedestre
    app-password: "123456"
    app-nome: Pedestre Dev

logging:
  level:
    br.com.startjob.acesso: INFO
    org.springframework.security: INFO
