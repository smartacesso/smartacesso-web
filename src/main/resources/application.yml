spring:
  application:
    name: smartacesso-web
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: always
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  servlet:
    context-path: /sistema
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

smartacesso:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: 8h
    login-rate-limit:
      capacity: 10
      window: 1m
    # COMPAT: desktop /access/* permanece sem auth (legado). REQUIRED exige token.
    desktop-api-mode: COMPAT
    # Não rehash SHA-256 → BCrypt no login enquanto o token desktop embute o hash.
    password-upgrade-on-login: false
    include-password-hash-in-desktop-login: true
  audit:
    login-events: true
