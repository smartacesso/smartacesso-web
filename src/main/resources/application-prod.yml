spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  liquibase:
    enabled: true
    url: ${DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

smartacesso:
  security:
    jwt:
      secret: ${JWT_SECRET}
    desktop-api-mode: COMPAT
    password-upgrade-on-login: false

logging:
  level:
    root: INFO
    br.com.startjob.acesso: INFO
    org.springframework.security: WARN
