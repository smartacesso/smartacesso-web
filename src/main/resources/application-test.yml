spring:
  datasource:
    url: jdbc:h2:mem:smartacesso-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false

smartacesso:
  security:
    jwt:
      secret: test-secret-must-be-at-least-32-chars
    login-rate-limit:
      capacity: 1000
      window: 1m
  bootstrap:
    enabled: false

logging:
  level:
    br.com.startjob.acesso: WARN
    org.springframework.security: WARN
